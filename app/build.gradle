plugins {
    alias(libs.plugins.androidApplication)
}

android {
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    compileSdkVersion 37
    namespace 'com.apk.editor'

    defaultConfig {
        minSdkVersion 23
        targetSdk 37
        versionCode 36
        versionName "v0.36"
        vectorDrawables.useSupportLibrary = true
        testFunctionalTest = false
        testHandleProfiling = false

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        ciSigning {
            // Populated only when CI decodes the keystore next to this file.
            storeFile file('keidts-release.p12')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'not-set'
            keyAlias System.getenv('KEY_ALIAS') ?: 'not-set'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'not-set'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign only when the keystore file exists (CI builds);
            // unsigned otherwise so local builds keep working.
            if (file('keidts-release.p12').exists()) {
                signingConfig signingConfigs.ciSigning
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions.add("release")
    productFlavors {
        play {
            applicationId "com.apk.explorer"
            dimension "release"
        }
        full {
            applicationId "com.apk.editor"
            dimension "release"
        }
        // Keidts: the alongside build. Own application ID, so it
        // installs NEXT TO the original AEE without touching it.
        keidts {
            applicationId "com.keidts.editor"
            dimension "release"
        }
    }
    lint {
        abortOnError false
    }

}

dependencies {
    api(project(":navView"))

    implementation libs.apksig
    implementation libs.axml
    implementation libs.crashReporter

    implementation libs.apkutils
    implementation libs.adapters
    implementation libs.credits
    implementation libs.fileutils
    implementation libs.installerutils
    implementation libs.packageutils
    implementation libs.permissionutils
    implementation libs.themeutils
    implementation libs.translatorutils

    implementation libs.documentfile
    implementation libs.material
    implementation libs.zip4j
    implementation libs.baksmali
    implementation libs.smali
}